name: Publish verified DSH bundle
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsh-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the tagged source and publish the install archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init -q source
          cd source
          repo_url="https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --tags "$repo_url" 'refs/heads/main:refs/remotes/origin/main'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
            tag="v$(git show "$GITHUB_SHA:package.json" | jq -er .version)"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Waiting for release tag $tag"
              exit 0
            fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git checkout -q --detach "refs/tags/$tag"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse --verify "$GITHUB_SHA^{commit}")" ]]
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          [[ "v$(jq -er .version package.json)" == "$tag" ]]
          node --test test/client.test.js test/server.test.js
          python3 tools/verify_release.py
          name=dsh-bundle-docker-upgrade.tgz
          cp "releases/dsh-bundle-docker-upgrade-${tag#v}.tgz" "$name"
          sha256sum "$name" > "$name.sha256"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$tag" --notes 'DSH Docker upgrade settings bundle and SHA-256 checksum.' "$name" "$name.sha256"
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir verify \
            --pattern "$name" --pattern "$name.sha256"
          cmp "$name" "verify/$name"
          cmp "$name.sha256" "verify/$name.sha256"
